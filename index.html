<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cadastro</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>

<body>

    <main class="cartao">
        <h1>Cadastro</h1>
        <p class="subtitulo">Preencha os três campos e clique em Enviar.</p>

        <!-- FORMULÁRIO: o novalidate deixa a validação por conta do JavaScript -->
        <form id="formCadastro" novalidate>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="digite seu nome" autocomplete="name">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="digite seu e-mail" autocomplete="email">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="digite sua senha" autocomplete="new-password">

            <button type="submit" id="btnEnviar">Enviar</button>
        </form>

        <!-- MENSAGENS: o JavaScript escreve o texto; enquanto estão vazias, ficam escondidas -->
        <p id="mensagemErro" class="erro" role="alert"></p>
        <p id="mensagemSucesso" class="sucesso" role="status"></p>
    </main>

    <script src="./js/validador.js"></script>
</body>

</html>
